<style>

    --bg:#0f172a; --card:#1b2638; --ink:#e8eef6; --muted:#9aa9bd; --line:#2d3b52;
    --slate:#0b1220; --blue:#46b0ea; --blue-soft:#14324a; --orange:#ff8650; --orange-soft:#3a2418;
    --ok:#4ade80; --ok-soft:#12331f; --bad:#f87171; --bad-soft:#3b1717; --pi:#ef5a50;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --card:#1b2638; --ink:#e8eef6; --muted:#9aa9bd; --line:#2d3b52;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.7;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px}
header.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 14px;border-bottom:2px solid var(--slate);margin-bottom:18px}
.logo{display:flex;align-items:center;gap:8px;direction:ltr;font-weight:800;letter-spacing:.18em;font-size:20px}
.logo .pi{font-family:Georgia,'Times New Roman',serif;font-size:34px;color:var(--pi);line-height:1;font-style:italic;letter-spacing:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{font-size:26px;margin:0 0 6px;line-height:1.3}
p.lead{color:var(--muted);margin:0 0 18px}

.facts li{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:3px 14px;font-size:14px;font-weight:600}
label.fld{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:3px solid var(--blue-soft);border-color:var(--blue)}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 26px;font-weight:700;background:var(--orange);color:#fff;margin-top:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--slate);border:1.5px solid var(--line)}
:root[data-theme="dark"] .btn.ghost{color:var(--ink)}

.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .3s}

.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qnum{background:var(--blue);color:#fff;border-radius:10px;padding:2px 12px;font-weight:800}

.given{direction:ltr;background:var(--slate);color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-family:'Cambria Math','Times New Roman',serif;font-size:18px;text-align:center;overflow-x:auto}
.given .mx{display:inline-block;vertical-align:middle;border-left:2px solid #fff;border-right:2px solid #fff;border-radius:6px;padding:2px 10px}
.given .mx table{border-collapse:collapse}
.given .mx td{padding:1px 10px;text-align:center}
.given .sys{display:inline-block;text-align:left;border-left:2px solid #fff;padding-left:10px}
.opts{display:grid;gap:10px}
.opt{direction:ltr;text-align:left;display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink);font-size:16px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--slate);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.opt .t{font-family:'Cambria Math','Times New Roman',serif;font-size:18px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb h3{margin:0 0 6px;font-size:17px}
.steps{direction:ltr;text-align:left;margin:8px 0 0;padding:0;list-style:none;font-family:'Cambria Math','Times New Roman',serif;font-size:17px}
.steps li{padding:4px 0;border-top:1px dashed var(--line)}
.steps li:first-child{border-top:0}
.note{margin-top:10px;background:var(--orange-soft);border-right:4px solid var(--orange);border-radius:6px;padding:8px 12px;font-size:15px}
.score{text-align:center;padding:10px 0 4px}
.score .big{font-size:56px;font-weight:800;line-height:1.1;color:var(--orange)}
.score .of{color:var(--muted);font-weight:600}
.who{font-weight:700;font-size:18px}
.review{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.review li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.review .m{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.review .m.ok{background:var(--ok)}.review .m.bad{background:var(--bad)}
.review .q{direction:ltr;text-align:left;flex:1}
.review small{display:block;color:var(--muted)}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:14px}
.foot b{direction:ltr;unicode-bidi:embed}
.katex{font-size:1.1em}
.given .katex-display{margin:.15em 0}
.given .katex-display>.katex{text-align:center}
.katex-display{overflow-x:auto;overflow-y:hidden}
.hide{display:none}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

<script>
var Q = [
{
  tag:'ترتيب النهايات',
  rv:'$\\int_{a}^{b}x\\,dx=F(a)-F(b)$',
  text:'Let $F$ be an antiderivative of $x$. Is the following statement true or false?',
  given:'$$\\int_{a}^{b}x\\,dx=F(a)-F(b)$$',
  opts:['True','False'], ans:1,
  steps:['Fundamental Theorem: $\\displaystyle\\int_{a}^{b}f(x)\\,dx=F(b)-F(a)$','Here $F(x)=\\dfrac{x^{2}}{2}$, so $\\displaystyle\\int_{a}^{b}x\\,dx=\\frac{b^{2}}{2}-\\frac{a^{2}}{2}=F(b)-F(a)$','Test: $\\displaystyle\\int_{0}^{2}x\\,dx=2$, but $F(0)-F(2)=-2$'],
  note:'دايمًا النهاية العليا ناقص النهاية السفلى. لو عكست الترتيب الإشارة بتتغير.'
},
{
  tag:'نهايتين متساويتين',
  rv:'$\\int_{3}^{3}\\left(e^{x}\\cosh x+\\sin^{2}x\\cos 5x-\\ln x\\right)dx=0$',
  text:'Is the following statement true or false?',
  given:'$$\\int_{3}^{3}\\left(e^{x}\\cosh x+\\sin^{2}x\\cos 5x-\\ln x\\right)dx=0$$',
  opts:['True','False'], ans:0,
  steps:['For any $f$ defined at $a$: $\\displaystyle\\int_{a}^{a}f(x)\\,dx=F(a)-F(a)=0$','The integrand is continuous at $x=3$, so the rule applies','Therefore the integral equals $0$'],
  note:'مش محتاج تحسب أي حاجة: النهايتين متساويتين يبقى الناتج صفر مهما كانت الدالة معقدة.'
},
{
  tag:'ثابت سالب',
  rv:'$\\int_{-2}^{3}(-4)\\,dx$',
  text:'Evaluate the definite integral below.',
  given:'$$\\int_{-2}^{3}(-4)\\,dx$$',
  opts:['$20$','$-20$','$-4$','$4$'], ans:1,
  steps:['$\\displaystyle\\int_{a}^{b}c\\,dx=c\\,(b-a)$','$b-a=3-(-2)=5$','$(-4)(5)=-20$'],
  note:'العرض $(b-a)$ هنا 5 مش 1، لأن النهاية السفلى سالبة. والإشارة جاية من الثابت.'
},
{
  tag:'حدود سالبة',
  rv:'$\\int_{-1}^{2}(3x^{2}-2x+1)\\,dx$',
  text:'Evaluate the definite integral below.',
  given:'$$\\int_{-1}^{2}\\left(3x^{2}-2x+1\\right)dx$$',
  opts:['$9$','$3$','$6$','$15$'], ans:0,
  steps:['$F(x)=x^{3}-x^{2}+x$','$F(2)=8-4+2=6$','$F(-1)=-1-1-1=-3$','$F(2)-F(-1)=6-(-3)=9$'],
  note:'غلطة شائعة إنك تنسى تطرح $F(-1)$ (فتطلع 6)، أو تجمعها بدل ما تطرحها (فتطلع 3).'
},
{
  tag:'مقارنة مع عكس النهايات',
  rv:'$f\\ge g$ on $[1,5]$ — which must be true?',
  text:'Suppose $f(x)\\ge g(x)$ for all $x$ in $[1,5]$. Which of the following must be true?',
  given:'$$f(x)\\ge g(x),\\qquad x\\in[1,5]$$',
  opts:['$\\displaystyle\\int_{1}^{5}f\\,dx\\le\\int_{1}^{5}g\\,dx$',
        '$\\displaystyle\\int_{5}^{1}f\\,dx\\ge\\int_{5}^{1}g\\,dx$',
        '$\\displaystyle\\int_{5}^{1}f\\,dx\\le\\int_{5}^{1}g\\,dx$',
        '$\\displaystyle\\int_{1}^{5}\\left(f-g\\right)dx<0$'], ans:2,
  steps:['Comparison rule ($a<b$): $f\\ge g$ on $[a,b]\\ \\Rightarrow\\ \\displaystyle\\int_{a}^{b}f\\ge\\int_{a}^{b}g$','So $\\displaystyle\\int_{1}^{5}f\\ge\\int_{1}^{5}g$, which rules out (a) and (d)','Reverse the limits: $\\displaystyle\\int_{5}^{1}f=-\\int_{1}^{5}f\\ \\le\\ -\\int_{1}^{5}g=\\int_{5}^{1}g$','Multiplying by $-1$ flips the inequality, so (c) is the one that holds'],
  note:'قاعدة المقارنة شغالة بس لما النهاية السفلى أصغر من العليا. ولما تعكس النهايات، المتباينة بتنعكس.'
},
{
  tag:'نظام من التكاملات',
  rv:'$\\int_{0}^{3}(f+g)=10,\\ \\int_{0}^{3}(f-g)=2\\ \\Rightarrow\\ \\int_{0}^{3}(3f-g)$',
  text:'Suppose that the two integrals below are known. Then find the value of the third.',
  given:'$$\\int_{0}^{3}\\left[f(x)+g(x)\\right]dx=10,\\qquad \\int_{0}^{3}\\left[f(x)-g(x)\\right]dx=2$$ $$\\int_{0}^{3}\\left[3f(x)-g(x)\\right]dx=\\ ?$$',
  opts:['$10$','$14$','$22$','$8$'], ans:1,
  steps:['Let $A=\\displaystyle\\int_{0}^{3}f\\,dx$ and $B=\\displaystyle\\int_{0}^{3}g\\,dx$','$A+B=10$ and $A-B=2\\ \\Rightarrow\\ A=6,\\ B=4$','$\\displaystyle\\int_{0}^{3}(3f-g)\\,dx=3A-B=18-4=14$'],
  note:'فصّل كل تكامل بالخطية الأول، وبعدين حل معادلتين في مجهولين $A$ و $B$.'
},
{
  tag:'حدود التكامل',
  rv:'$2\\le f(x)\\le 5$ on $[-1,3]$',
  text:'If $2\\le f(x)\\le 5$ for $-1\\le x\\le 3$, then $I=\\displaystyle\\int_{-1}^{3}f(x)\\,dx$ must satisfy',
  given:'$$2\\le f(x)\\le 5,\\qquad -1\\le x\\le 3$$',
  opts:['$8\\le I\\le 20$','$2\\le I\\le 5$','$6\\le I\\le 15$','$4\\le I\\le 10$'], ans:0,
  steps:['Max-min inequality: $\\min f\\cdot(b-a)\\le I\\le\\max f\\cdot(b-a)$','$b-a=3-(-1)=4$','Lower bound: $2\\cdot4=8$, &nbsp; upper bound: $5\\cdot4=20$','$8\\le I\\le 20$'],
  note:'العرض بيتحسب $3-(-1)=4$. لو حسبته 3 هتوصل للاختيار (c) وده غلط.'
},
{
  tag:'المساحة والتكامل',
  rv:'Area between $y=x^{2}-2x$ and the $x$-axis on $[0,3]$',
  text:'Let $f(x)=x^{2}-2x$. The area of the region between the graph of $f$ and the $x$-axis over $[0,3]$ is',
  given:'$$f(x)=x^{2}-2x,\\qquad x\\in[0,3]$$',
  opts:['$0$','$\\displaystyle\\frac{4}{3}$','$\\displaystyle\\frac{8}{3}$','$\\displaystyle-\\frac{8}{3}$'], ans:2,
  steps:['Roots: $x(x-2)=0\\Rightarrow x=0,\\ 2$. &nbsp; $f\\le0$ on $[0,2]$ and $f\\ge0$ on $[2,3]$','$\\displaystyle\\int_{0}^{2}f\\,dx=\\left[\\frac{x^{3}}{3}-x^{2}\\right]_{0}^{2}=\\frac{8}{3}-4=-\\frac{4}{3}$','$\\displaystyle\\int_{2}^{3}f\\,dx=\\left(9-9\\right)-\\left(\\frac{8}{3}-4\\right)=\\frac{4}{3}$','Area $=\\left|-\\dfrac{4}{3}\\right|+\\dfrac{4}{3}=\\dfrac{8}{3}$'],
  note:'لو حسبت $\\int_{0}^{3}f\\,dx$ هتطلع 0، لأن الجزء تحت المحور بيتطرح. المساحة الحقيقية لازم تفصل الجزأين وتاخد القيمة المطلقة.'
},
{
  tag:'ثابت التكامل',
  rv:'Definite integrals always include a constant of integration.',
  text:'Is the following statement true or false?',
  given:'Definite integrals always include a constant of integration.',
  opts:['True','False'], ans:1,
  steps:['Using $F(x)+c$: $\\ [F(b)+c]-[F(a)+c]=F(b)-F(a)$','The constant $c$ cancels','Example: $\\displaystyle\\int_{0}^{2}x\\,dx=2$, a number with no $c$'],
  note:'الـ $+c$ بتظهر في التكامل غير المحدد بس. التكامل المحدد ناتجه رقم.'
},
{
  tag:'مسألة مركبة',
  rv:'$\\int_{0}^{4}f=8,\\ \\int_{2}^{4}f=3\\ \\Rightarrow\\ \\int_{0}^{2}[2f(x)-1]\\,dx$',
  text:'If $\\displaystyle\\int_{0}^{4}f(x)\\,dx=8$ and $\\displaystyle\\int_{2}^{4}f(x)\\,dx=3$, then',
  given:'$$\\int_{0}^{2}\\left[2f(x)-1\\right]dx=\\ ?$$',
  opts:['$3$','$0$','$8$','$1$'], ans:2,
  steps:['Additivity: $\\displaystyle\\int_{0}^{2}f\\,dx=\\int_{0}^{4}f\\,dx-\\int_{2}^{4}f\\,dx=8-3=5$','Linearity: $\\displaystyle\\int_{0}^{2}\\left[2f-1\\right]dx=2\\int_{0}^{2}f\\,dx-\\int_{0}^{2}1\\,dx$','$\\displaystyle\\int_{0}^{2}1\\,dx=2$','$=2(5)-2=8$'],
  note:'الـ $-1$ جوه التكامل بتتحول لـ $-(b-a)=-2$ مش $-1$.'
}
];
var L = ['a','b','c','d'];
var st = {name:'', i:0, picked:[], done:false};

function $(id){return document.getElementById(id)}
function typeset(el){
  if(window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}
function show(id){['start','quiz','result'].forEach(function(s){$(s).classList.toggle('hide', s!==id)}); window.scrollTo(0,0);}
function stripTags(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent}

$('name').addEventListener('input', function(){ $('go').disabled = this.value.trim().length < 2; });
$('name').addEventListener('keydown', function(e){ if(e.key==='Enter' && !$('go').disabled) $('go').click(); });
$('go').addEventListener('click', function(){
  st = {name:$('name').value.trim(), i:0, picked:[], done:false};
  show('quiz'); render();
});

function render(){
  var q = Q[st.i], n = Q.length;
  $('count').textContent = (st.i+1) + ' / ' + n;
  $('barfill').style.width = (st.i/n*100) + '%';
  var h = '<div class="qhead"><span class="qnum">' + (st.i+1) + '</span><span class="qtype">' + q.tag + '</span></div>' +
    '<p class="qtext">' + q.text + '</p><div class="given">' + q.given + '</div><div class="opts" role="radiogroup">';
  q.opts.forEach(function(o,k){
    h += '<button class="opt" data-k="'+k+'" role="radio" aria-checked="false"><span class="l">'+L[k]+'</span><span class="t">'+o+'</span></button>';
  });
  h += '</div><div id="fb"></div><div id="act"><button class="btn" id="confirm" disabled>تأكيد الإجابة</button></div>';
  $('qcard').innerHTML = h; typeset($('qcard'));
  st.sel = null; st.done = false;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
    b.addEventListener('click', function(){
      if(st.done) return;
      st.sel = +b.dataset.k;
      Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(x){
        var on = (x===b); x.classList.toggle('sel', on); x.setAttribute('aria-checked', on);
      });
      $('confirm').disabled = false;
    });
  });
  $('confirm').addEventListener('click', confirmAns);
}

function confirmAns(){
  var q = Q[st.i]; if(st.sel===null) return;
  st.done = true; st.picked[st.i] = st.sel;
  var right = st.sel === q.ans;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
    var k = +b.dataset.k; b.disabled = true; b.classList.remove('sel');
    if(k===q.ans) b.classList.add('ok'); else if(k===st.sel) b.classList.add('bad');
  });
  var fb = '<div class="fb ' + (right?'ok':'bad') + '"><h3>' + (right ? 'إجابة صحيحة ✓' : 'إجابة غلط. الصح هو (' + L[q.ans] + ')') + '</h3>' +
    '<ul class="steps">' + q.steps.map(function(s){return '<li>'+s+'</li>'}).join('') + '</ul>' +
    (q.note ? '<div class="note"><b>انتبه:</b> ' + q.note + '</div>' : '') + '</div>';
  $('fb').innerHTML = fb; typeset($('fb'));
  var last = st.i === Q.length-1;
  $('act').innerHTML = '<button class="btn" id="next">' + (last ? 'شوف النتيجة' : 'السؤال اللي بعده') + '</button>';
  $('next').addEventListener('click', function(){
    if(last) finish(); else { st.i++; render(); window.scrollTo(0,0); }
  });
  $('next').focus();
}

function finish(){
  var score = 0; Q.forEach(function(q,i){ if(st.picked[i]===q.ans) score++; });
  var pct = Math.round(score/Q.length*100);
  var msg = pct===100 ? 'ممتاز، كل الإجابات صح!' : pct>=70 ? 'شغل حلو، راجع الأسئلة اللي غلطت فيها.' : pct>=50 ? 'مستواك كويس بس محتاج مراجعة.' : 'راجع ورقة القواعد وحاول تاني.';
  var h = '<div class="score"><div class="who"></div><div class="big">' + score + '<span class="of"> / ' + Q.length + '</span></div><div>' + pct + '% · ' + msg + '</div></div><ul class="review">';
  Q.forEach(function(q,i){
    var ok = st.picked[i]===q.ans;
    h += '<li><span class="m ' + (ok?'ok':'bad') + '">' + (ok?'✓':'✗') + '</span><div class="q">' + (i+1) + '. ' + q.rv +
      '<small>' + (ok ? 'إجابتك: (' + L[q.ans] + ') ' + q.opts[q.ans] : 'إجابتك: (' + L[st.picked[i]] + ') ' + q.opts[st.picked[i]] + ' · الصح: (' + L[q.ans] + ') ' + q.opts[q.ans]) + '</small></div></li>';
  });
  h += '</ul><div style="text-align:center"><button class="btn ghost" id="again">حاول من الأول</button></div>';
  $('result').innerHTML = h; typeset($('result'));
  $('result').querySelector('.who').textContent = st.name;
  $('barfill').style.width = '100%';
  $('again').addEventListener('click', function(){ show('start'); });
  show('result');
}
</script>
</body>
</html>
