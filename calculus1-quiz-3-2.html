*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

const L = ['A','B','C','D'];
const app = document.getElementById('app');
const countEl = document.getElementById('count');
let cur = 0, score = 0, answers = [];

/* use the real logo image from the Midterm page when this page is hosted next to it */
fetch('quiz-midterm-mock.html').then(r=>r.text()).then(t=>{
  const m=t.match(/<div class="logo"><img[^>]*src="(data:image\/png;base64,[^"]+)"/);
  if(m) document.getElementById('logo').innerHTML='<img alt="ELMOGY" src="'+m[1]+'">';
}).catch(()=>{});

function fit(){
  const o=document.querySelector('.opts');
  if(!o||o.classList.contains('one')) return;
  if([...o.querySelectorAll('.t')].some(el=>el.scrollWidth>el.clientWidth+1)) o.classList.add('one');
}
function typeset(){
  if(window.renderMathInElement){
    renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});
    fit();
  } else { setTimeout(typeset,150); }
}

function cover(){
  countEl.textContent='Quiz';
  app.innerHTML=`<div class="card cover">
    <div class="bigno" aria-hidden="true">${Q.length}</div>
    <h1>Lesson ${LESSON} — Quiz</h1>
    <p>${SUB}<br><small>${Q.length} أسئلة اختيار من متعدد</small></p>
    <button class="btn" id="start">ابدأ الكويز</button>
  </div>`;
  document.getElementById('start').onclick=()=>{cur=0;score=0;answers=[];show();window.scrollTo({top:0});};
  typeset();
}

function segs(){
  return `<div class="segs" aria-hidden="true">${Q.map((_,i)=>`<div class="seg ${i<answers.length?(answers[i].ok?'ok':'bad'):(i===cur?'cur':'')}"></div>`).join('')}</div>`;
}

function show(){
  const item=Q[cur];
  countEl.textContent=(cur+1)+' / '+Q.length;
  const plain=item.o.map(t=>t.replace(/\\[a-z]+|[\\(){}]/g,'')).reduce((m,t)=>Math.max(m,t.length),0);
  app.innerHTML=`${segs()}
    <div class="card">
      <div class="qrow"><span class="pill">Q${cur+1}</span><div class="stem">${item.q}</div></div>
      <div class="opts ${plain>24?'one':''}">${item.o.map((t,i)=>`<button class="opt" data-i="${i}"><span class="l">${L[i]}</span><span class="t">${t}</span></button>`).join('')}</div>
      <div class="exp" id="exp" role="status"></div>
      <button class="btn next" id="next">${cur===Q.length-1?'شوف النتيجة':'السؤال التالي'}</button>
    </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  document.getElementById('next').onclick=()=>{cur++;cur<Q.length?show():finish();window.scrollTo({top:0});};
  typeset();
}

function pick(i){
  const item=Q[cur], ok=i===item.a;
  if(ok) score++;
  answers.push({i,ok});
  app.querySelectorAll('.opt').forEach((b,k)=>{
    b.disabled=true;
    if(k===item.a) b.classList.add('ok');
    else if(k===i) b.classList.add('bad');
    else b.classList.add('dim');
  });
  document.querySelectorAll('.seg')[cur].className='seg '+(ok?'ok':'bad');
  const e=document.getElementById('exp');
  e.className='exp show '+(ok?'ok':'bad');
  e.innerHTML=`<span class="t">${ok?'إجابة صحيحة':'إجابة خاطئة، الصحيحة هي '+L[item.a]}</span>${item.e}`;
  document.getElementById('next').classList.add('show');
  typeset();
  document.getElementById('next').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function finish(){
  countEl.textContent='Quiz';
  const pct=score/Q.length, R=62, C=2*Math.PI*R;
  const col=pct>=.7?'var(--ok)':pct>=.5?'var(--orange)':'var(--bad)';
  const msg=pct===1?'ممتاز، كل الإجابات صح':pct>=.7?'جيد جدًا، راجع الغلط':pct>=.5?'مستوى متوسط، راجع الدرس وجرّب تاني':'راجع الدرس وأعد الكويز';
  app.innerHTML=`${segs()}
    <div class="card result">
      <div class="ring"><svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="${R}" fill="none" stroke="#DCE4F3" stroke-width="12"/>
        <circle cx="75" cy="75" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
        <div class="n">${score}<small>من ${Q.length}</small></div></div>
      <div class="msg">${msg}</div>
      <button class="btn" id="again">أعد الكويز</button>
      <div class="rv"><h2>مراجعة الأسئلة</h2>
        ${Q.map((it,k)=>`<details class="${answers[k].ok?'ok':'bad'}"${answers[k].ok?'':' open'}>
          <summary><span class="s">${answers[k].ok?'✓':'✗'}</span><span class="qq">Q${k+1}. ${it.q}</span></summary>
          <div class="dbody"><div class="ans">${L[it.a]}) ${it.o[it.a]}</div>${it.e}</div></details>`).join('')}
      </div>
    </div>`;
  document.getElementById('again').onclick=()=>{cur=0;score=0;answers=[];show();window.scrollTo({top:0});};
  typeset();
}

window.addEventListener('load',cover);
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
window.addEventListener('resize',fit);
</script>
</body>
</html>
